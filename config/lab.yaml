# Lab watcher config (python -m app.lab_watch)
#
# A paper counts as a lab paper if it matches ANY of:
#   - affiliations: keyword found in an author's affiliation ("NeuroPoly Lab, ...")
#   - authors: ORCID (preferred) or OpenAlex author IDs
#
# Affiliations catch most lab papers without listing anyone. Listing authors
# catches papers where the affiliation doesn't say "NeuroPoly".
# ORCID matters because OpenAlex often splits one person into several
# profiles, and ORCID covers all of them. Look people up with:
#   python -m app.lab_watch --find "Full Name" "Other Name"
#
# Before adding someone, check their profile isn't merged with a homonym:
# every work on it gets posted as a lab paper, and its citations get tracked.

lab_name: NeuroPoly

# Only papers published in this window are considered. Seen papers are tracked
# in the DB, so a window wider than the run interval just catches late indexing.
lookback_days: 30

affiliations:
  - NeuroPoly

authors:
