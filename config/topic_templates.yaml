# Pre-curated topic templates for common research areas.
# The LLM selects and adjusts these based on the user's description,
# rather than generating keywords from scratch.

templates:
  - name: axon-myelin-segmentation
    description: "Automated segmentation of axons and myelin in electron microscopy"
    include_any:
      # Core task + tools first (used as search query terms)
      - axon segmentation
      - myelin segmentation
      - AxonDeepSeg
      - DeepACSON
      - FIB-SEM
      - SBEM
      - connectomics
      - axon morphometry
      # Remaining core terms (used for scoring only)
      - myelinated axon
      - axon and myelin
      - white matter segmentation
      - neurite segmentation
      - axon tracing
      - axon reconstruction
      - neural reconstruction
      # Known tools and papers
      - ACSON
      - gACSON
      # EM modalities
      - serial block-face
      - SBEM
      - serial block-face
      - volume electron microscopy
      - 3D electron microscopy
      - serial section electron microscopy
      - array tomography
      - electron microscopy segmentation
      - EM segmentation
      - SBEM segmentation
      # Biological structures
      - myelin sheath
      - axon morphometry
      - axon diameter
      - axon caliber
      - oligodendrocyte segmentation
      - periaxonal space
      - Ranvier node
      - white matter ultrastructure
      - nerve fiber segmentation
      # ML task variants
      - volumetric segmentation neural
      - dense reconstruction connectomics
      - instance segmentation white matter
      - panoptic segmentation EM
      - proofreading connectome
      - agglomeration neuron
      - skeletonization axon
      # Architectures and methods
      - Flood Filling Networks
      - 3D U-Net segmentation
      - watershed neuron
      # Foundation models for EM
      - Segment Anything microscopy
      - SAM electron microscopy
      - EM-SAM
      # General
      - connectomics
      - multi-domain segmentation microscopy
    include_all: []
    exclude:
      - MRI
      - fMRI
      - retina
      - retinal
      - plant
      - cardiac
      - speech
      - satellite
      - remote sensing
      - seismic
      - alloy
      - semiconductor
      - nanomaterial
      - polymer
      - white matter lesion
      - white matter hyperintens
      - tumor
      - cancer
      - clinical trial
    boost_authors:
      - Cohen-Adad
      - Abdollahzadeh
      - Zaimi
      - Duval
      - Lichtman
      - Helmstaedter
      - Seung
      - Denk
      - Knott
    boost_venues:
      - Scientific Reports
      - Communications Biology
      - NeuroImage
      - Nature Methods
      - Nature Neuroscience
      - MICCAI
      - Medical Image Analysis
      - ISBI
      - MIDL
      - Frontiers in Neuroanatomy
      - Journal of Neuroscience Methods
      - eLife

