app = 'ourak'
primary_region = 'yyz'

[build]
  dockerfile = 'Dockerfile'

[build.args]
  VITE_API_URL = ''

[env]
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

[[mounts]]
  source = 'paperwatch_data'
  destination = '/app/data'
  initial_size = '1gb'
