name: Lab Watch

on:
  schedule:
    # Mondays 13:00 UTC (9:00 Montreal in summer, 8:00 in winter)
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print results in the job log only (no Slack post, no state update)"
        type: boolean
        default: false

permissions:
  contents: write  # push the seen-papers DB to the state branch

concurrency: lab-watch

env:
  STATE_BRANCH: lab-watch-state
  PAGES_BRANCH: gh-pages
  DATABASE_URL: sqlite:///data/lab_watch.db
  LAB_CITATIONS_URL: https://yolaatar.github.io/ourak/

jobs:
  lab-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The DB of already-posted papers lives on its own branch so main stays clean
      - name: Restore seen-papers state
        run: |
          mkdir -p data
          if git fetch --depth 1 origin "$STATE_BRANCH:refs/remotes/origin/$STATE_BRANCH"; then
            git show "origin/$STATE_BRANCH:lab_watch.db" > data/lab_watch.db
          else
            echo "No state branch yet, starting fresh"
          fi

      - name: Run lab watcher
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python -m app.lab_watch ${{ inputs.dry_run && '--dry-run' || '' }}

      # Regenerate the citations digest page from the just-updated DB, while we're
      # still on `main` — the state-branch checkout below switches the working tree
      # out from under us, so stage this alongside the DB copy first.
      - name: Generate citations page
        if: ${{ !inputs.dry_run }}
        run: python -m app.citations_page > "$RUNNER_TEMP/index.html"

      # Force-push a single commit: only the latest DB is kept, so the repo
      # doesn't accumulate a copy of the binary file every week
      - name: Save seen-papers state
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp data/lab_watch.db "$RUNNER_TEMP/lab_watch.db"
          git checkout -q --orphan "$STATE_BRANCH"
          git rm -rq --cached .
          cp "$RUNNER_TEMP/lab_watch.db" lab_watch.db
          git add lab_watch.db
          git commit -qm "Lab watch state"
          git push -q --force origin "$STATE_BRANCH"

      # Same force-push-single-commit pattern, on its own orphan branch for Pages.
      # digest.yml publishes digest.html to this same branch, so pull whatever's
      # already there first — an orphan checkout starts empty, and overwriting it
      # with just our own file would silently delete the other workflow's page.
      - name: Publish citations page
        if: ${{ !inputs.dry_run }}
        run: |
          mkdir -p "$RUNNER_TEMP/pages"
          if git fetch --depth 1 origin "$PAGES_BRANCH:refs/remotes/origin/$PAGES_BRANCH" 2>/dev/null; then
            git archive "origin/$PAGES_BRANCH" | tar -x -C "$RUNNER_TEMP/pages"
          fi
          cp "$RUNNER_TEMP/index.html" "$RUNNER_TEMP/pages/index.html"
          git checkout -q --orphan "$PAGES_BRANCH"
          git rm -rq --cached .
          cp -r "$RUNNER_TEMP/pages/." .
          git add -A
          git commit -qm "Citations digest page"
          git push -q --force origin "$PAGES_BRANCH"
