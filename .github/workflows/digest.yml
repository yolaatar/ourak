name: Paper Watch Digest

on:
  schedule:
    # Runs every Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write  # push the seen-papers DB to the state branch

concurrency: paper-watch-digest

env:
  STATE_BRANCH: digest-state
  DATABASE_URL: sqlite:///data/paperwatch.db

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The DB of already-posted papers lives on its own branch so main stays clean
      - name: Restore seen-papers state
        run: |
          mkdir -p data
          if git fetch --depth 1 origin "$STATE_BRANCH:refs/remotes/origin/$STATE_BRANCH"; then
            git show "origin/$STATE_BRANCH:paperwatch.db" > data/paperwatch.db
          else
            echo "No state branch yet, starting fresh"
          fi

      - name: Run paper-watch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m app.main

      # Force-push a single commit: only the latest DB is kept, so the repo
      # doesn't accumulate a copy of the binary file every week
      - name: Save seen-papers state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp data/paperwatch.db "$RUNNER_TEMP/paperwatch.db"
          git checkout -q --orphan "$STATE_BRANCH"
          git rm -rq --cached .
          cp "$RUNNER_TEMP/paperwatch.db" paperwatch.db
          git add paperwatch.db
          git commit -qm "Digest state"
          git push -q --force origin "$STATE_BRANCH"
